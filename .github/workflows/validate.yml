name: Validate learning packs
on: [push, pull_request]
jobs:
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate_pack.py examples/*.learning.json ios/ReverseLearning/*.learning.json
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cmp examples/machine-learning.learning.json ios/ReverseLearning/sample.learning.json
      - run: |
          for name in spanish-basics python-foundations study-skills github-basics github-advanced; do
            cmp "examples/$name.learning.json" "ios/ReverseLearning/$name.learning.json"
          done
  grading:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc ios/ReverseLearning/LearningPack.swift scripts/test_grading.swift -o /tmp/test-grading
      - run: /tmp/test-grading

  creator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r creator/requirements.txt
      - run: python -m unittest discover -s creator -p 'test_*.py'
